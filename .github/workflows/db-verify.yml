name: Live database verification

# Runs the RLS + API acceptance suites against the real Supabase project.
# Manual only: it provisions and deletes a throwaway account on the live project.
on:
  workflow_dispatch:

concurrency:
  group: db-verify
  cancel-in-progress: false

jobs:
  live:
    name: Live RLS & API
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: RLS suite against the live database (transactional, rolled back)
        run: psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/20_live_rls_test.sql

      - name: End-to-end API suite (GoTrue → PostgREST → RLS)
        run: bash supabase/tests/30_live_api_test.sh
