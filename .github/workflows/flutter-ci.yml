name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Publishing the update release needs to write releases (and nothing else).
permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.50.0"
  # Public fingerprint of the Pulse upload certificate (safe to publish; the
  # keystore itself is a secret). Used to prove CI produced a properly signed APK.
  UPLOAD_CERT_SHA256: "80:1B:67:A4:5A:40:BA:B8:D2:F8:43:8C:2C:55:45:2B:BE:BD:09:04:71:21:85:29:BC:7B:73:E0:C9:2D:11:23"

jobs:
  migrations:
    name: Migrations & RLS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql
          pg_config --version

      - name: Apply migrations to a fresh database and run the RLS suite
        run: bash supabase/tests/run_local.sh

  edge-functions:
    name: Edge Functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check every Edge Function
        run: |
          for f in supabase/functions/*/index.ts; do
            echo "→ $f"
            deno check "$f"
          done

      - name: Unit tests (payload building, error mapping, RS256 signing)
        run: deno test --allow-env supabase/functions/

  analyze-and-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Print toolchain
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Static analysis (errors + warnings are fatal)
        run: flutter analyze

      - name: Unit & widget tests
        run: flutter test --reporter expanded

  build-apk:
    name: Build release APK
    needs: analyze-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No keystore secret set - the APK will be debug-signed."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing/pulse-upload.jks"
          {
            printf 'storeFile=%s\n' "$RUNNER_TEMP/signing/pulse-upload.jks"
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > android/key.properties
          echo "keystore ready ($(wc -c < "$RUNNER_TEMP/signing/pulse-upload.jks") bytes)"

      - name: Build release APK
        run: |
          # The build number IS the update channel: it is what the installed app
          # compares itself against, and it must go up on every push.
          flutter build apk --release \
            --build-name="0.1.${{ github.run_number }}" \
            --build-number="${{ github.run_number }}" \
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}" \
            --dart-define=CLOUDINARY_CLOUD_NAME="${{ secrets.CLOUDINARY_CLOUD_NAME }}" \
            --dart-define=BUILD_LABEL="$(git rev-parse --short HEAD)-run${{ github.run_number }}"

      - name: Assert the release manifest can reach the network
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | tail -1)
          "$AAPT2" dump permissions "$APK" | tee /tmp/perms.txt
          # Phase 1/2 APKs shipped without INTERNET: every request failed and the
          # app told the user it was offline. This gate makes that impossible again.
          for perm in android.permission.INTERNET android.permission.POST_NOTIFICATIONS android.permission.RECORD_AUDIO; do
            grep -q "$perm" /tmp/perms.txt \
              || { echo "::error::release manifest is missing $perm"; exit 1; }
          done
          echo "network + notification + microphone permissions present"

      - name: Assert the APK is signed with the Pulse upload key
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/certs.txt
          if [ -f android/key.properties ]; then
            GOT=$(grep -i 'certificate SHA-256 digest' /tmp/certs.txt | head -1 | awk '{print $NF}' | tr -d ':' | tr 'A-Z' 'a-z')
            EXP=$(printf '%s' "${{ env.UPLOAD_CERT_SHA256 }}" | tr -d ':' | tr 'A-Z' 'a-z')
            echo "expected: $EXP"
            echo "actual  : $GOT"
            [ "$GOT" = "$EXP" ] || { echo "::error::APK not signed with the Pulse upload certificate"; exit 1; }
            echo "signature verified against the published upload certificate"
          else
            echo "::warning::debug-signed build (no keystore secret configured)"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pulse-release-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 14
          if-no-files-found: error

      # `latest.json` + the APK in one GitHub Release is the whole update server:
      # the app reads `releases/latest/download/latest.json`, compares the build
      # number with its own, and downloads the sibling `pulse.apk`. Publishing is
      # skipped on pull requests, which must never move the update channel.
      - name: Publish the update release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.run_number }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          cp "$APK" pulse.apk
          SHA=$(sha256sum pulse.apk | awk '{print $1}')
          SIZE=$(stat -c%s pulse.apk)
          VERSION="0.1.$RUN"
          {
            printf '{\n'
            printf '  "versionName": "%s",\n' "$VERSION"
            printf '  "versionCode": %s,\n' "$RUN"
            printf '  "apkUrl": "https://github.com/%s/releases/latest/download/pulse.apk",\n' "${{ github.repository }}"
            printf '  "sizeBytes": %s,\n' "$SIZE"
            printf '  "sha256": "%s",\n' "$SHA"
            printf '  "publishedAt": "%s",\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            printf '  "notes": [\n'
            # The commit subject and up to three of its body lines, as real JSON
            # strings — the update page shows them verbatim.
            printf '%s\n' "$NOTES" | head -4 | sed '/^$/d' | sed 's/^[[:space:]]*//' \
              | jq -R . | paste -sd, - | sed 's/^/  /'
            printf '\n  ]\n'
            printf '}\n'
          } > latest.json
          python3 -c "import json;json.load(open('latest.json'));print('manifest is valid JSON')"
          echo "::notice::publishing $VERSION (build $RUN, $SIZE bytes, sha256 ${SHA:0:12}…)"
          gh release create "build-$RUN" pulse.apk latest.json \
            --title "Pulse $VERSION" \
            --notes "Automatic build $RUN from \`${GITHUB_SHA::7}\`. Installed apps will offer this update on next launch." \
            --latest
