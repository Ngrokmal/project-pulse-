name: pulse
description: "PULSE — Chat · Call · Connect"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  supabase_flutter: ^2.18.3
  intl: ^0.20.3
  uuid: ^4.6.0
  material_ui: ^1.11.0
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  hive_ce: ^2.23.3
  hive_ce_flutter: ^2.5.0
  http: ^1.6.0
  file_picker: ^13.3.3
  url_launcher: ^6.3.3
  record: ^7.2.0
  just_audio: ^0.10.6
  video_player: ^2.10.0
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  crypto: ^3.0.8
  package_info_plus: ^10.2.2
  qr_flutter: ^4.1.0
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/png/
    - assets/images/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
